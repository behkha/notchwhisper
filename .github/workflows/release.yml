name: Release

# Create a GitHub Release when a version tag is pushed.
#
# Binary .dmg distribution is currently DISABLED: the app is not notarized, so
# downloads would trip Gatekeeper ("Apple could not verify … free of malware").
# Users clone the repo and build from source (see README "Installing"). Re-enable
# dmg build/upload in this workflow once Developer ID signing + notarization is
# wired in.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create GitHub Release (source only)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
